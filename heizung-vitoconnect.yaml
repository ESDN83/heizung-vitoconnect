                uint8_t frame[] = {0x01, 0xF4, 0x33, 0x03, 0x01, 0x01};
                id(uart_vito).write_array(frame, sizeof(frame));
                id(uart_vito).flush();
                ESP_LOGI("vito_w", "Party M2 ON OK");
                return;
              }
            }
            delay(1);
          }
          ESP_LOGW("vito_w", "Party M2 ON FAILED");
    turn_off_action:
      - lambda: |-
          while (id(uart_vito).available()) { uint8_t d; id(uart_vito).read_byte(&d); }
          id(uart_vito).write_byte(0x04);
          id(uart_vito).flush();
          uint32_t t = millis();
          while (millis() - t < 2000) {
            if (id(uart_vito).available()) {
              uint8_t b; id(uart_vito).read_byte(&b);
              if (b == 0x05) {
                uint8_t frame[] = {0x01, 0xF4, 0x33, 0x03, 0x01, 0x00};
                id(uart_vito).write_array(frame, sizeof(frame));
                id(uart_vito).flush();
                ESP_LOGI("vito_w", "Party M2 OFF OK");
                return;
              }
            }
            delay(1);
          }
          ESP_LOGW("vito_w", "Party M2 OFF FAILED");

