esphome:
  name: heizung-vitoconnect
  friendly_name: Heizung Vitoconnect

esp32:
  board: esp32dev
  framework:
    type: arduino
    advanced:
      # Beide Werte empfiehlt ESPHome beim Start selbst (Chip rev3.1, Bootloader
      # kann SRAM1 als IRAM): kleineres Binary, 40 KB mehr IRAM.
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

logger:
  level: INFO
  baud_rate: 0   # KRITISCH: UART0 Logger aus, sonst Konflikt mit Optolink

api:
  encryption:
    key: !secret heizung_api_encryption_key

ota:
  # Passwort bleibt vorerst: das laufende Firmware verlangt es, ein Upload ohne
  # Passwort koennte abgewiesen werden (dann nur noch USB-Flash im Keller).
  # ESPHome-Warnung "ota password wastes flash" daher bewusst noch offen.
  - platform: esphome
    password: !secret heizung_ota_password

# Webseite des ESP (wie beim Garagentor). local: true liefert die Oberflaeche
# vom ESP selbst aus, ohne Nachladen von oi.esphome.io (keine externen Ressourcen).
# Werte: http://192.168.1.80/  Log live: http://192.168.1.80/events
web_server:
  port: 80
  version: 3
  local: true
  include_internal: false

# Ethernet LAN8720 (WT32-ETH01)
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:
    mode: CLK_EXT_IN
    pin:
      number: 0
      ignore_strapping_warning: true   # WT32-ETH01: GPIO0 = externer 50-MHz-Takt, bauartbedingt
  phy_addr: 1
  power_pin: GPIO16

# Bluetooth-Proxy am 23.09.2026 entfernt: BLE-Funk teilt sich die CPU mit
# Ethernet und der Optolink-UART (4800 Baud), Verdacht als Mitursache fuer das
# eingefrorene Optolink-Lesen 19.09. bis 23.09.2026 (nicht belegt). Im Keller
# empfangen weiter drain-pump und Shelly_Gefriertruhe_Hausanschlussraum.

# ===================================================================
# Optolink UART
# TX=GPIO2  <- 180 Ohm <- SFH 487-3 (880nm) Kathode(-) | Anode(+) <- 3.3V
# RX=GPIO4  <- 10k Pull-up <- SFH 309 FA Collector | Emitter -> GND
# ===================================================================
uart:
  - id: uart_vito
    tx_pin:
      number: GPIO2
      ignore_strapping_warning: true   # Optolink-TX, keine Pull-Widerstaende angeschlossen
    rx_pin: GPIO4
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

# Lokales Vitoconnect-Component mit 3000UL Timing-Fix fuer V200KW2
#external_components:
#  - source:
#      type: local
#      path: custom_components

# Eigene Kopie des dannerph-Components (MIT): 3000UL Timing-Fix, ohne
# check_uart_settings (ESPHome 2027.3), ohne UB-Casts, OptolinkDP mit operator=.
# Details: components/vitoconnect/HERKUNFT.md
external_components:
  - source: github://ESDN83/heizung-vitoconnect@stand-2026-09-23-selbstheilung
    components: [vitoconnect]
    refresh: 0s

vitoconnect:
  id: vito
  uart_id: uart_vito
  protocol: KW
  # 150s statt 30s (23.09.2026): jede Abfrage wartet auf das naechste 0x05 der
  # KW2, ca. 3 s pro Datenpunkt. Bei ~37 Datenpunkten dauert ein Durchlauf ca.
  # 112 s. Mit 30s schob update() alle 30 s die komplette Liste nach, die Queue
  # (48) lief voll und nur die ersten ~10 Datenpunkte (Betriebsart, Raumsoll,
  # Heizkurve) kamen noch dran; Aussen, Kessel, WW usw. verhungerten und sahen
  # eingefroren aus (belegt per DEBUG-Log 23.09.2026 17:21 bis 17:43).
  # Faustregel: update_interval > Anzahl Datenpunkte x 3 s.
  update_interval: 150s

# ===================================================================
# Fallback: HA-Verbindung tracken
# ===================================================================
globals:
  - id: ha_last_seen
    type: int
    restore_value: no
    initial_value: '0'
  # Herzschlag des Optolink-Lesens (23.09.2026): vom 19.09. 16:19 bis 23.09.
  # 14:56 hing das Lesen still, das ESP blieb erreichbar, Schreiben ging weiter.
  # on_value der Aussentemperatur setzt den Zeitstempel bei JEDER Abfrage
  # (dannerph decode() ruft publish_state immer auf, auch bei gleichem Wert).
  - id: vito_last_read
    type: uint32_t
    restore_value: no
    initial_value: '0'
  # Zaehlt Selbst-Neustarts ohne erfolgreiches Lesen dazwischen. Ueberlebt den
  # Neustart, damit bei stromloser Heizung nicht endlos alle 15 min neu gestartet wird.
  - id: vito_reboots
    type: int
    restore_value: yes
    initial_value: '0'
  # Zeitpunkt des letzten Uhr-Stellens (millis). Sperrt das automatische Stellen
  # fuer 1 h, damit bei einer Regelung, die den Wert nicht uebernimmt, keine
  # Schleife entsteht.
  - id: uhr_gestellt_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

# ===================================================================
# Uhr der Regelung (23.09.2026)
# Nach jedem Stromausfall faellt die Uhr der Vitotronic zurueck und das Display
# fragt "Uhrzeit und Datum einstellen". Systemzeit 0x088E, 8 Byte BCD:
# JJ JJ MM TT WT hh mm ss. Die Regelung liefert sie nur als ganzen Block.
# Lesen und Schreiben laufen ueber read_raw/write_raw der Komponente, also durch
# dieselbe Queue wie alle anderen Abfragen (kein direkter UART-Zugriff).
# ===================================================================
time:
  - platform: homeassistant
    id: ha_zeit

script:
  - id: uhr_lesen
    mode: single
    then:
      - lambda: |-
          id(vito).read_raw(0x088E, 8, [](const uint8_t *d, uint8_t len) {
            if (len != 8) {
              ESP_LOGW("vito_uhr", "Systemzeit: %u statt 8 Byte", len);
              return;
            }
            for (int i = 0; i < 8; i++) {
              if ((d[i] >> 4) > 9 || (d[i] & 0x0F) > 9) {
                ESP_LOGW("vito_uhr", "Systemzeit kein BCD: %02X %02X %02X %02X %02X %02X %02X %02X",
                         d[0], d[1], d[2], d[3], d[4], d[5], d[6], d[7]);
                return;
              }
            }
            auto b = [](uint8_t v) -> int { return (v >> 4) * 10 + (v & 0x0F); };
            int jahr = b(d[0]) * 100 + b(d[1]);
            int mon = b(d[2]), tag = b(d[3]), wt = b(d[4]);
            int std_ = b(d[5]), min_ = b(d[6]), sek = b(d[7]);
            char txt[96];
            snprintf(txt, sizeof(txt), "%02d.%02d.%04d %02d:%02d:%02d WT%d",
                     tag, mon, jahr, std_, min_, sek, wt);
            id(uhr_regelung).publish_state(txt);
            if (mon < 1 || mon > 12 || tag < 1 || tag > 31 || std_ > 23 || min_ > 59 || sek > 59) {
              ESP_LOGW("vito_uhr", "Systemzeit unplausibel: %s", txt);
              return;
            }
            auto jetzt = id(ha_zeit).now();
            if (!jetzt.is_valid()) return;
            // Tage seit 1970 (Algorithmus von Howard Hinnant). Beide Seiten sind
            // Ortszeit, deshalb stimmt die Differenz auch ueber die Zeitumstellung.
            auto tage = [](int y, int m, int t) -> int64_t {
              y -= m <= 2;
              int64_t era = (y >= 0 ? y : y - 399) / 400;
              int64_t yoe = y - era * 400;
              int64_t doy = (153 * (m + (m > 2 ? -3 : 9)) + 2) / 5 + t - 1;
              int64_t doe = yoe * 365 + yoe / 4 - yoe / 100 + doy;
              return era * 146097 + doe - 719468;
            };
            int64_t s_regel = tage(jahr, mon, tag) * 86400 + std_ * 3600 + min_ * 60 + sek;
            int64_t s_ha = tage(jetzt.year, jetzt.month, jetzt.day_of_month) * 86400
                         + jetzt.hour * 3600 + jetzt.minute * 60 + jetzt.second;
            int64_t diff = s_regel - s_ha;
            id(uhr_abweichung).publish_state((float) diff);
            ESP_LOGI("vito_uhr", "Regelung %s, Abweichung %lld s", txt, (long long) diff);
            if (id(uhr_auto).state && (diff > 120 || diff < -120)
                && (id(uhr_gestellt_ms) == 0 || millis() - id(uhr_gestellt_ms) > 3600000UL)) {
              ESP_LOGW("vito_uhr", "Abweichung %lld s, stelle Uhr automatisch", (long long) diff);
              id(uhr_stellen).execute();
            }
          });

  - id: uhr_stellen
    mode: single
    then:
      # Erst schreiben, wenn die Queue leer ist. Sonst wartet der Schreibzugriff
      # hinter bis zu ~37 Abfragen (je ca. 3 s) und die Uhr geht danach um bis zu
      # 2 min nach.
      - wait_until:
          condition:
            lambda: 'return id(vito).queue_size() == 0;'
          timeout: 180s
      - lambda: |-
          auto t = id(ha_zeit).now();
          if (!t.is_valid()) {
            ESP_LOGW("vito_uhr", "Keine gueltige HA-Zeit, Uhr wird nicht gestellt");
            return;
          }
          id(uhr_gestellt_ms) = millis();
          if (id(uhr_gestellt_ms) == 0) id(uhr_gestellt_ms) = 1;
          auto b = [](int v) -> uint8_t { return (uint8_t)(((v / 10) << 4) | (v % 10)); };
          // ESPTime zaehlt 1=So bis 7=Sa, Viessmann 1=Mo bis 7=So. Die Regelung
          // rechnet den Wochentag beim Setzen ohnehin selbst.
          int wt = t.day_of_week == 1 ? 7 : t.day_of_week - 1;
          uint8_t d[8] = { b(t.year / 100), b(t.year % 100), b(t.month), b(t.day_of_month),
                           b(wt), b(t.hour), b(t.minute), b(t.second) };
          bool ok = id(vito).write_raw(0x088E, 8, d,
            [](const uint8_t *, uint8_t) {
              ESP_LOGI("vito_uhr", "Uhr gestellt, lese zur Kontrolle zurueck");
              id(uhr_lesen).execute();
            },
            [](uint8_t e) { ESP_LOGW("vito_uhr", "Uhr stellen fehlgeschlagen (Fehler %u)", e); });
          ESP_LOGI("vito_uhr", "Uhr stellen auf %02d.%02d.%04d %02d:%02d:%02d: %s",
                   t.day_of_month, t.month, t.year, t.hour, t.minute, t.second,
                   ok ? "eingereiht" : "Queue voll");

interval:
  # Uhr der Regelung alle 10 min lesen (und bei Bedarf automatisch stellen).
  - interval: 10min
    then:
      - script.execute: uhr_lesen
  # Selbstheilung Optolink-Lesen (23.09.2026): 15 min kein frischer Wert
  # (und mindestens 15 min seit dem Start) -> Neustart. Hoechstens 3 Mal am Stueck
  # ohne erfolgreiches Lesen dazwischen, danach wird nicht mehr neu gestartet
  # (z.B. Heizung stromlos), HA meldet dann ueber "Heizung Vitoconnect eingefroren".
  - interval: 60s
    then:
      - if:
          condition:
            lambda: |-
              return millis() > 900000UL
                  && (millis() - id(vito_last_read)) > 900000UL
                  && id(vito_reboots) < 3;
          then:
            - lambda: |-
                id(vito_reboots) += 1;
                ESP_LOGW("vito_wd", "Optolink liefert seit 15 min nichts, Neustart %d/3", id(vito_reboots));
                global_preferences->sync();
            - delay: 1s
            - lambda: 'App.safe_reboot();'
  - interval: 60s
    then:
      - if:
          condition:
            api.connected:
          then:
            - globals.set:
                id: ha_last_seen
                value: !lambda 'return millis() / 1000;'
      - if:
          condition:
            and:
              - not:
                  api.connected:
              - lambda: 'return (millis() / 1000 - id(ha_last_seen)) > 3600;'
              - lambda: 'return !isnan(id(aussentemperatur).state) && id(aussentemperatur).state < 15.0;'
          then:
            - logger.log: "FALLBACK: HA > 1h nicht erreichbar + TempA < 15C"
            - lambda: |-
                // --- Fallback M1 WW+Heizung ---
                while (id(uart_vito).available()) { uint8_t d; id(uart_vito).read_byte(&d); }
                id(uart_vito).write_byte(0x04);
                id(uart_vito).flush();
                uint32_t t = millis();
                while (millis() - t < 2000) {
                  if (id(uart_vito).available()) {
                    uint8_t b; id(uart_vito).read_byte(&b);
                    if (b == 0x05) {
                      uint8_t f[] = {0x01, 0xF4, 0x23, 0x23, 0x01, 0x02};
                      id(uart_vito).write_array(f, 6);
                      id(uart_vito).flush();
                      ESP_LOGI("fallback", "M1 -> WW+Heizung OK");
                      break;
                    }
                  }
                  delay(1);
                }
                delay(3000);
                // --- Fallback M2 WW+Heizung ---
                while (id(uart_vito).available()) { uint8_t d; id(uart_vito).read_byte(&d); }
                id(uart_vito).write_byte(0x04);
                id(uart_vito).flush();
                t = millis();
                while (millis() - t < 2000) {
                  if (id(uart_vito).available()) {
                    uint8_t b; id(uart_vito).read_byte(&b);
                    if (b == 0x05) {
                      uint8_t f[] = {0x01, 0xF4, 0x33, 0x23, 0x01, 0x02};
                      id(uart_vito).write_array(f, 6);
                      id(uart_vito).flush();
                      ESP_LOGI("fallback", "M2 -> WW+Heizung OK");
                      break;
                    }
                  }
                  delay(1);
                }

# Neustart-Knopf fuer HA (23.09.2026): vorher ging ein Neustart nur per Neu-Deploy.
button:
  - platform: restart
    name: "Neustart"
  - platform: template
    name: "Uhr stellen"
    icon: mdi:clock-edit-outline
    entity_category: config
    on_press:
      - script.execute: uhr_stellen

text_sensor:
  - platform: template
    name: "Uhrzeit Regelung"
    id: uhr_regelung
    icon: mdi:clock-outline
    entity_category: diagnostic
    update_interval: never

# ===================================================================
# SENSOREN  --  VScotHO1 (Geraete-ID 0x20CB, hier per KW-Protokoll)
# ===================================================================
sensor:

  # -- Interne Sensoren (fuer kombinierte Steuer-Entities) --
  - platform: vitoconnect
    id: betriebsart_m1_raw
    address: 0x2323
    length: 1
    internal: true

  - platform: vitoconnect
    id: betriebsart_m2_raw
    address: 0x3323
    length: 1
    internal: true

  - platform: vitoconnect
    id: raumsoll_normal_m1_raw
    address: 0x2306
    length: 1
    internal: true

  - platform: vitoconnect
    id: raumsoll_red_m1_raw
    address: 0x2307
    length: 1
    internal: true

  - platform: vitoconnect
    id: raumsoll_normal_m2_raw
    address: 0x3306
    length: 1
    internal: true

  - platform: vitoconnect
    id: raumsoll_red_m2_raw
    address: 0x3307
    length: 1
    internal: true

  - platform: vitoconnect
    id: ww_soll_raw
    address: 0x6300
    length: 1
    internal: true

  # Heizkurve: KORRIGIERTE Adressen (P300-Style, aktive Werte)
  # Alt 0x2305/0x2304 enthielt veraltete Daten, korrekt: 0x27D3/0x27D4
  - platform: vitoconnect
    id: hk_neigung_m1_raw
    address: 0x27D3
    length: 1
    internal: true
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    id: hk_niveau_m1_raw
    address: 0x27D4
    length: 1
    internal: true

  - platform: vitoconnect
    id: hk_neigung_m2_raw
    address: 0x37D3
    length: 1
    internal: true
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    id: hk_niveau_m2_raw
    address: 0x37D4
    length: 1
    internal: true

  # -- Temperaturen (sichtbar) --
  - platform: vitoconnect
    name: "Aussentemperatur"
    id: aussentemperatur
    address: 0x5525
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1
    on_value:
      - lambda: |-
          id(vito_last_read) = millis();
          // Zaehler erst nach 20 min stabilem Lesen zuruecksetzen. Vorher setzten
          // die ersten Werte nach jedem Neustart den Zaehler zurueck, die Grenze
          // von 3 Neustarts griff nie (Loop alle 18 min am 23.09.2026).
          if (id(vito_reboots) != 0 && millis() > 1200000UL) id(vito_reboots) = 0;

  - platform: vitoconnect
    name: "Aussentemperatur gedaempft"
    address: 0x5527
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Kesseltemperatur"
    address: 0x0802
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Kessel Solltemperatur"
    address: 0x555A   # VScotHO1 (20CB) laut openv; 0x5502 lieferte konstant -0,1
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Warmwassertemperatur"
    address: 0x0804
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # 0x0808 ist bei der VScotHO1 (20CB) laut openv der Ruecklauf (getTempRL17A),
  # kein Abgasfuehler. Vorher als "Abgastemperatur" gefuehrt; das alte
  # "Ruecklauftemperatur" auf 0x080A lieferte 114 °C (bei 20CB nicht belegt).
  - platform: vitoconnect
    name: "Ruecklauftemperatur"
    address: 0x0808
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # Diagnose 23.09.2026: openv nennt fuer 20CB 0x3900 (getTempVListM2); 0x080C
  # laeuft bisher plausibel. Beide eine Weile vergleichen, dann einen entfernen.
  - platform: vitoconnect
    name: "Diagnose Vorlauf M2 0x3900"
    address: 0x3900
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Vorlauftemperatur M2"
    address: 0x080C
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Vorlauf Solltemperatur M1"
    address: 0x2544
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Vorlauf Solltemperatur M2"
    address: 0x3544
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  - platform: vitoconnect
    name: "Speichertemperatur"
    address: 0x0812
    length: 2
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - multiply: 0.1

  # -- Brenner --
  - platform: vitoconnect
    name: "Brennerstarts"
    address: 0x088A
    length: 2
    unit_of_measurement: ""
    icon: mdi:fire
    state_class: total_increasing
    accuracy_decimals: 0

  - platform: vitoconnect
    name: "Brennerstunden"
    address: 0x08A7
    length: 4
    unit_of_measurement: "h"
    icon: mdi:fire-circle
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - multiply: 0.000277778  # /3600 (Sekunden -> Stunden)

  - platform: vitoconnect
    name: "Brennerleistung"
    id: brennerleistung
    address: 0x55D3   # VScotHO1 (20CB) getBrennerStatus, Prozent; 0x55E3 gab es hier nicht
    length: 1
    unit_of_measurement: "%"
    icon: mdi:fire-alert
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: 'return x >= 255 ? NAN : x;'

  # -- Geraete-ID (0x00F8): 0x20CB = VScotHO1, Protokoll KW/300 (openv) --
  # Nicht V200KW2 (0x2098)! Deshalb lieferten die KW2-Adressen 0x551E, 0x0845,
  # 0x0846 und 0x7579 nur 0xFF. Adressen unten laut openv vcontrold
  # xml/300/vito.xml fuer Geraet 20CB. dannerph setzt data[1]<<8|data[0]
  # zusammen, der Filter dreht die Bytes zurueck: 8395 = 0x20CB.
  - platform: vitoconnect
    name: "Geraete-ID dezimal"
    address: 0x00F8
    length: 2
    entity_category: diagnostic
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t u = (uint16_t)(int16_t)(int)x;
          return (float)(((u & 0xFF) << 8) | (u >> 8));

  # -- Pumpe Heizkreis M1: 0x7663, 2 Byte, zweites Byte = Drehzahl in % --
  - platform: vitoconnect
    name: "Umwaelzpumpe M1 Drehzahl"
    id: pumpe_m1_drehzahl
    address: 0x7663
    length: 2
    unit_of_measurement: "%"
    icon: mdi:pump
    state_class: measurement
    accuracy_decimals: 0
    filters:
      - lambda: |-
          uint16_t u = (uint16_t)(int16_t)(int)x;
          return (float)(u >> 8);

  # Mischer M1/M2 (0x254C/0x354C) am 23.09.2026 entfernt: bei der 20CB immer 255.

  # Regelung minus HA-Zeit, gefuellt vom Skript uhr_lesen.
  - platform: template
    name: "Uhr Abweichung"
    id: uhr_abweichung
    unit_of_measurement: "s"
    icon: mdi:clock-alert-outline
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: never

# ===================================================================
# BINAERE SENSOREN
# ===================================================================
binary_sensor:
  # Adressen fuer VScotHO1 (20CB) laut openv, siehe Geraete-ID oben. Die Namen
  # sind unveraendert, damit die HA-Entitaeten und ihr Verlauf erhalten bleiben.
  # Brenner/Umwaelzpumpe M1 sind Template-Sensoren aus den Prozentwerten.
  - platform: template
    name: "Brenner"
    device_class: running
    lambda: |-
